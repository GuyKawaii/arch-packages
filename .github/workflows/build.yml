# Build, test and publish the packages.
#
#   pull_request        build + test what the PR changes (no publishing)
#   push to main        build + test what is not published yet, then publish
#   workflow_dispatch   same as the event of the chosen branch; Renovate fixups
#                       and python rebuilds dispatch this on their branch, since
#                       pushes made with GITHUB_TOKEN start no workflow run
#   schedule (weekly)   open a python-rebuild PR when Arch's python moved on,
#                       and publish anything on main that is still unpublished
#
# The "build" job is the required status check that gates automerge.
name: build

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      packages:
        description: 'Also build these package directories (space separated, or "all")'
        type: string
        default: ''
      python-check:
        description: 'Run the python rebuild check (main only)'
        type: boolean
        default: false
  schedule:
    - cron: '23 5 * * 1'

permissions: {}

defaults:
  run:
    shell: bash

concurrency:
  # One run per branch. On side branches the newest run wins (a fixup commit
  # supersedes the run on the unfixed commit); on main runs queue up instead.
  group: build-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    container: archlinux:base-devel
    permissions:
      contents: read
    outputs:
      built: ${{ steps.plan.outputs.built }}
    steps:
      - name: Install git for checkout
        run: echo 'Server = https://stable-mirror.omarchy.org/$repo/os/$arch' > /etc/pacman.d/mirrorlist && pacman -Syyuu --noconfirm --needed git

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare container
        run: bash ci/container-setup.sh namcap

      - name: Plan
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          FORCE: ${{ inputs.packages }}
        run: |
          base=
          if [[ $EVENT == pull_request ]]; then
            base=origin/$BASE_REF
          elif [[ $GITHUB_REF_NAME != main ]]; then
            base=origin/main
          fi
          mkdir -p "$RUNNER_TEMP/published"
          source ci/lib.sh
          fetch_db "$RUNNER_TEMP/published" || true
          bash ci/plan.sh "$RUNNER_TEMP/published" "$base" "$FORCE" > "$RUNNER_TEMP/plan"
          echo "Build order: $(tr '\n' ' ' < "$RUNNER_TEMP/plan")"
          if [[ -s $RUNNER_TEMP/plan ]]; then
            echo built=true >> "$GITHUB_OUTPUT"
          else
            echo built=false >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        if: steps.plan.outputs.built == 'true'
        run: |
          mapfile -t dirs < "$RUNNER_TEMP/plan"
          OUT=out bash ci/build.sh "${dirs[@]}"

      - name: Smoke test
        if: steps.plan.outputs.built == 'true'
        run: OUT=out bash ci/smoke-test.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.plan.outputs.built == 'true'
        with:
          name: packages
          path: out/*.pkg.tar.zst
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' &&
      needs.build.outputs.built == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: archlinux:base-devel
    # Put GPG_PRIVATE_KEY / GPG_PASSPHRASE in this environment and limit it to main.
    environment: publish
    permissions:
      contents: write
    concurrency:
      group: publish
      cancel-in-progress: false
    steps:
      - name: Install tools
        run: echo 'Server = https://stable-mirror.omarchy.org/$repo/os/$arch' > /etc/pacman.d/mirrorlist && pacman -Syyuu --noconfirm --needed git github-cli

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: out

      - name: Sign and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GPG_KEY_ID: ${{ vars.GPG_KEY_ID }}
        run: bash ci/publish.sh out

  # Weekly: when Arch's python minor version is newer than the one a published
  # package was built for, bump its pkgrel on a rebuild/* branch and open a PR.
  # The PR is built by dispatching this workflow on that branch (see
  # merge-rebuild below).
  python-rebuild:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' || inputs.python-check)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: archlinux:base-devel
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: Install git for checkout
        run: echo 'Server = https://stable-mirror.omarchy.org/$repo/os/$arch' > /etc/pacman.d/mirrorlist && pacman -Syyuu --noconfirm --needed git

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare container
        run: bash ci/container-setup.sh github-cli

      - name: Open rebuild PR if python changed
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          source ci/lib.sh
          mkdir -p "$RUNNER_TEMP/published"
          if ! fetch_db "$RUNNER_TEMP/published"; then exit 0; fi
          mapfile -t dirs < <(bash ci/python-outdated.sh "$RUNNER_TEMP/published")
          if ((${#dirs[@]} == 0)); then
            echo "All published packages match Arch's python."
            exit 0
          fi
          py=$(arch_python_minor)
          branch=rebuild/python-$py
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            echo "$branch already exists; its PR is pending."
            exit 0
          fi
          git switch -c "$branch"
          for d in "${dirs[@]}"; do
            bump_pkgrel "$d"
            chown -R builder:builder "$d"
            srcinfo_regen "$d"
            git add -- "$d/PKGBUILD" "$d/.SRCINFO"
          done
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m "chore: rebuild ${dirs[*]} for python $py"
          git push origin "HEAD:refs/heads/$branch"
          gh pr create --base main --head "$branch" \
            --title "chore: rebuild ${dirs[*]} for python $py" \
            --body "Arch now ships python $py. This bumps pkgrel so the packages are rebuilt against it. The build is dispatched on this branch and merges the PR when it passes."
          gh workflow run build.yml --ref "$branch"

  # Second half of python-rebuild: once the dispatched build on a rebuild/*
  # branch has passed, merge its PR and dispatch the publish on main. GITHUB_TOKEN
  # merges do not trigger the push workflow, so the dispatch does it instead.
  merge-rebuild:
    needs: build
    if: >-
      github.event_name == 'workflow_dispatch' &&
      startsWith(github.ref, 'refs/heads/rebuild/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: Merge and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh pr merge "$GITHUB_REF_NAME" --squash --match-head-commit "$GITHUB_SHA"
          gh api -X DELETE "repos/$GH_REPO/git/refs/heads/$GITHUB_REF_NAME" || true
          gh workflow run build.yml --ref main
